
# User-facing CLI copy, externalised from source.
# Consumed at compile time via include_str! in src/cli/copy.rs.
#
# Conventions:
#   - No em-dashes. Use period, colon, comma, or parenthesis.
#   - Plain, concise English accessible to non-developers.
#   - Placeholders use {name} syntax (expanded by callers, not by the lookup helper).

# -- Empty states -------------------------------------------------------

[empty-states.no-blueprint]
heading = "No blueprint found"
body = "No cairn.blueprint found. Run `cairn init` to create one."
cta = "cairn init"

[empty-states.no-findings]
heading = "No findings"
body = "No findings to report."
cta = "cairn scan"

[empty-states.no-nodes]
heading = "No nodes"
body = "No nodes declared in the blueprint."
cta = "cairn init"

[empty-states.node-no-paths]
heading = "No paths declared"
body = "This node has no source paths declared."
cta = "cairn get <node>"

[empty-states.node-no-artefacts]
heading = "No artefacts yet"
body = "This node has no artefacts yet. Its blueprint entry is ready to explore."
cta = ""

[empty-states.node-no-contracts]
heading = "No contracts"
body = "No contracts are attached to this node."
cta = "cairn contract <node>"

[empty-states.node-no-decisions]
heading = "No decisions"
body = "No decisions reference this node."
cta = "cairn decisions <node>"

[empty-states.node-no-todos]
heading = "No tasks"
body = "No open tasks for this node."
cta = "cairn todos <node>"

[empty-states.node-no-beads]
heading = "No beads"
body = "No beads link to this node."
cta = "bd ready"

[empty-states.node-no-research]
heading = "No research"
body = "No research artefacts link to this node."
cta = "cairn research <node>"

[empty-states.node-no-sources]
heading = "No sources"
body = "No source artefacts reference this node."
cta = "cairn sources <node>"

[empty-states.node-no-outbound]
heading = "No outbound dependencies"
body = "This node has no outbound dependencies."
cta = "cairn deps <node>"

[empty-states.node-no-inbound]
heading = "No inbound dependencies"
body = "No other nodes depend on this one."
cta = "cairn deps <node> --direction in"

[empty-states.node-no-symbols]
heading = "No symbols"
body = "No public symbols were extracted from this node."
cta = "cairn get <node> --symbols"

[empty-states.map-clean]
heading = "Map clean"
body = "All nodes reconciled. No drift detected."
cta = "cairn scan"
reconciled = "Last reconciled {last_reconciled}."
reconciled-pending = "Reconciliation time unavailable."

[empty-states.no-filter-matches]
heading = "No matches"
body = "No findings match the current filters."
cta = ""

[empty-states.search-no-matches]
heading = "No matches"
body = "No nodes match that query."
cta = ""

[empty-states.map-loading]
heading = ""
body = "Loading the map…"
cta = ""

[empty-states.map-failed]
heading = "Map failed to load"
body = "The graph data is missing or malformed. Check the cairn ui server and try again."
cta = "Retry"

[empty-states.node-artefacts-loading]
heading = ""
body = "Loading artefacts…"
cta = ""

[empty-states.node-artefacts-failed]
heading = ""
body = "Artefacts failed to load. Check the cairn ui server, then reselect the node."
cta = ""

[empty-states.cli-no-blueprint]
heading = "No blueprint found"
body = "No cairn.blueprint found. Inspection has nothing to look at."
cta = "Run `cairn init` to scaffold a blueprint, then re-run `cairn lint`."

[empty-states.cli-clean-map]
heading = "Blueprint clean"
body = "Blueprint reconciled cleanly. No findings."
cta = ""

[empty-states.cli-no-changes]
heading = "No active changes"
body = "No active changes in the changes directory."
cta = "Run `cairn change new <change-id>` to propose one."

# -- Findings -----------------------------------------------------------

[findings]
deferred-collapsed = "{count} deferred {noun} deferred by {decision}"
parked-suffix = " (parked by {todo})"

[findings.severity]
error = "Error: a blocking issue that must be resolved."
warning = "Warning: a potential issue worth reviewing."
info = "Info: an observation with no required action."

[findings.types]
orphaned-file = "A source file exists but no node owns its path."
ghost-node = "A declared node has no source files on disk."
missing-edge = "An observed dependency has no declared blueprint edge."
extra-edge = "A declared edge has no observed source dependency."
interface-contradiction = "Multiple contracts for the same role have divergent interfaces."
rationale-tension = "An intentional asymmetry was detected; review the rationale."

[findings.codes]
CAIRN_WAVE_READINESS_MOVED = { heading = "Plan declined: readiness moved", body = "A unit in plan `{target}` is no longer ready, so the recomputed wave differs.", cta = "Preview `cairn wave` again and consent to the new digest." }
CAIRN_WAVE_WRITE_SETS_OVERLAP = { heading = "Plan declined: write-sets overlap", body = "Two units in plan `{target}` no longer have disjoint write-sets.", cta = "Preview `cairn wave` again; the composer holds one of the units back." }
CAIRN_WAVE_UNIT_SET_MOVED = { heading = "Plan declined: composition moved", body = "The recomputed wave no longer yields plan `{target}`: the unit set, a write-set, or a unit's task definition changed.", cta = "Preview `cairn wave` again and consent to the new digest." }
CAIRN_WAVE_PARKED = { heading = "Plan declined: a unit is parked", body = "A unit in plan `{target}` is subtracted by a live ruling.park fact.", cta = "Unpark the unit or consent to the recomputed wave without it." }
CAIRN_WAVE_LEASE_HELD = { heading = "Plan declined: a lease is held", body = "A unit in plan `{target}` carries a live lease held by another session.", cta = "Wait for the lease to release or expire, then preview again." }
CAIRN_WAVE_RULESET_CHANGED = { heading = "Plan declined: the composer rule changed", body = "Plan `{target}` was composed under a different workflow rule.", cta = "Preview `cairn wave` under the current rule and consent to the new digest." }
CAIRN_WAVE_CONSENT_EXPIRED = { heading = "Plan declined: consent expired", body = "The run ruling for plan `{target}` is older than the driver's consent window.", cta = "Record a fresh `cairn ruling run` after previewing again." }
CAIRN_WAVE_ALREADY_CONSUMED = { heading = "Plan declined: already consumed", body = "Plan `{target}` already carries an outcome.run_consumed fact; consent is single-use.", cta = "Preview `cairn wave` again and consent to the new digest." }
CAIRN_WAVE_SUPERSEDED_BY_CONCURRENT_RULING = { heading = "Plan declined: superseded by a concurrent ruling", body = "Another ruling on the same digest or a shared unit wins the (recorded_at, fact_id) tie-break.", cta = "No action needed; the winning ruling dispatches." }
CAIRN_SPEC_RULE_DEFERRED_DECISION_INVALID = { heading = "Invalid spec-rule deferral", body = "Spec rule `{rule}` ({spec}) defers to `{decision}`, which is not an accepted decision.", cta = "Update the Deferred-by cell to name an accepted decision artefact." }
CAIRN_TODO_DEFERS_UNMATCHED = { heading = "Stale defers reference", body = "Todo `{todo}` defers `{code}` at `{location}`, but no emitted finding matches that reference.", cta = "Remove the stale `defers:` entry, or correct its code and path or node to match a standing finding." }
CAIRN_TODO_DEFERS_BLOCKING = { heading = "Defers reference targets a blocking finding", body = "Todo `{todo}` defers `{code}` at `{location}`, which is a {severity} finding; only Info findings can be parked.", cta = "Fix the finding instead: an Error or Warning stays selecting whatever any artefact declares about it." }
CAIRN_TODO_RELATION_UNKNOWN = { heading = "Todo points at something that is not there", body = "This todo names a related item that does not exist. Fix the name or remove the link.", cta = "Correct the `blocked_by`, `parent`, or `related` entry, or remove it." }
CAIRN_TODO_RELATION_CYCLE = { heading = "Todos block each other in a loop", body = "Following these links leads back to where it started, so nothing in the loop can ever start. Break one link.", cta = "Remove one `blocked_by` or `parent` entry from the loop." }
CAIRN_TODO_STATUS_CONTRADICTION = { heading = "Todo status disagrees with its links", body = "Either this todo is marked blocked with nothing left blocking it, or it is open while something it depends on is unfinished.", cta = "Update the status with `cairn todo set`, or fix the links with `cairn todo link`." }
CAIRN_DECISION_REFINED_AUTHORITY = { heading = "Accepted decision has an accepted refinement", body = "Decision `{node}` is refined by accepted decision `{target}`. Check the refinement before treating the original as the only authority.", cta = "Read the accepted refinement and cite the current decision chain." }
CAIRN_TODO_DEFERS_INVALID = { heading = "Malformed defers reference", body = "Todo `{todo}` has a malformed defers entry `{value}`; expected `<FINDING_CODE> <path-or-node>`.", cta = "Rewrite the entry as a finding code, one space, then the path or node the finding was raised against." }
CAIRN_RECONCILE_ORPHANED_FILE = { heading = "Orphaned file", body = "The file `{path}` exists on disk but no blueprint node claims its path.", cta = "Add a `path` entry to an existing node, or declare a new node." }
CAIRN_INTEGRITY_DUPLICATE_ID = { heading = "Duplicate node ID", body = "The ID `{node}` appears more than once in the blueprint.", cta = "Rename one of the duplicates to make every ID unique." }
CAIRN_INTEGRITY_INVALID_EDGE_ENDPOINT = { heading = "Invalid edge endpoint", body = "An edge references `{target}`, which does not exist in the map.", cta = "Check the edge declaration for typos, or declare the missing node." }
CAIRN_INTEGRITY_PATH_TIE = { heading = "Path ownership conflict", body = "Multiple nodes claim the path `{path}`.", cta = "Narrow one node's path pattern so each file has exactly one owner." }
CAIRN_INTERFACE_HASH_CHANGED = { heading = "Interface changed", body = "The contract hash for `{node}` no longer matches the last recorded value.", cta = "Run `cairn scan` to accept the new hash, or revert the contract change." }
CAIRN_MODULE_OVERSIZED = { heading = "Module too large", body = "`{path}` in `{node}` exceeds the 500-line module-size guideline with no allow-list marker.", cta = "Split the module, or add a `cairn:allow-large-module reason: ...` marker as its first non-blank line." }
CAIRN_ORDER_CYCLE = { heading = "Ordering cycle", body = "A cycle in ordering constraints (dependency edges, or containment contradicting a dependency edge) was detected involving `{node}`.", cta = "Break the cycle by removing or reversing one conflicting edge." }
CAIRN_CONTRACT_MISSING = { heading = "Missing contract", body = "Node `{node}` has no contract file.", cta = "Create a contract artefact describing this node's interface." }
CAIRN_SOURCE_UNVERIFIED = { heading = "Unverified source", body = "Source `{node}` has not been verified against its declared hash.", cta = "Run `cairn scan` to verify, or update the source record." }
CAIRN_SOURCE_SHA256_UNEXPECTED = { heading = "Tracked source declares a hash", body = "Source `{node}` is `tracked` but declares a sha256 digest.", cta = "Remove the sha256 field, or use `verification: verified` if the content should be frozen." }
CAIRN_SOURCE_SELF_REFERENCE = { heading = "Self-referential source", body = "Source `{node}` cites its own artefact file as its evidence, so it records no provenance.", cta = "Point `file:` at the real evidence, or set `file: null` when the material was never saved to a file." }
CAIRN_DECISION_ORPHANED = { heading = "Orphaned decision", body = "Decision `{node}` references nodes that no longer exist.", cta = "Update the decision's node references, or archive if no longer relevant." }
CAIRN_PROVENANCE_NO_DECISION = { heading = "No decision link", body = "Node `{node}` has no decision in its provenance chain.", cta = "Link a decision artefact explaining why this module exists." }
CAIRN_CONTRACT_MISSING_NODE = { heading = "Contract references unknown node", body = "A contract references `{node}`, which does not exist in the blueprint.", cta = "Fix the node reference in the contract, or declare the missing node." }
CAIRN_RECONCILE_LANGUAGE_UNKNOWN = { heading = "Unknown language", body = "The target `{target}` at `{path}` has a language that could not be inferred from its contents.", cta = "Set a `targets:` override in cairn.config.yaml, or add files with a supported extension." }
CAIRN_RECONCILE_EMPTY_TARGET = { heading = "Empty target", body = "The target `{target}` at `{path}` discovered zero files during reconciliation.", cta = "Check the path is correct, or remove the target if it is no longer needed." }
CAIRN_CONFIG_UNKNOWN_KEY = { heading = "Unknown config key", body = "cairn.config.yaml contains an unrecognised top-level key.", cta = "Use a supported key (`context`, `rules`, `artefact_types`, `targets`, `multi_target`, `ignore`, `gates`, `decision_accumulation_threshold`) or remove the entry." }
CAIRN_CHANGE_TASKS_COMPLETE = { heading = "Change tasks complete", body = "Change `{node}` has all tasks complete.", cta = "Run `cairn change apply {node}` to archive it." }
CAIRN_ARTEFACT_FILENAME_DRIFT = { heading = "Artefact filename drift", body = "The artefact at `{path}` is not named after its id.", cta = "Rename the file to its id without the typed prefix; todos keep `todo.<slug>.md`." }
CAIRN_CONTRACT_NODE_SHAPE_DRIFT = { heading = "Contract not reviewed against current node shape", body = "The baseline for `{node}` was recorded against a different node shape; `{target}` changed.", cta = "Re-read the contract against the current declaration, then re-record its baseline." }
CAIRN_DECISION_ACCUMULATION = { heading = "Accepted decisions accumulating", body = "Node `{node}` carries {count} accepted decisions (threshold {threshold}).", cta = "Author one consolidating decision listing the stale set in its `supersedes` field (the parser never reads `superseded_by`), and set each of those targets to `status: superseded`. Both halves are required: a target left accepted keeps counting here and also raises CAIRN_DECISION_SUPERSEDES_STATUS. Superseded decisions keep their provenance and drop out of default payloads." }
CAIRN_DECISION_RATIFICATION_INVALID = { heading = "Invalid ratification tier", body = "Decision `{path}` declares `{value}` for `ratification:`, but only `local` and `binding` are valid.", cta = "Set `ratification:` to `local` or `binding`, or omit it for the binding default." }
CAIRN_DECISION_RATIFIED_BY_INVALID = { heading = "Invalid ratification signer", body = "Decision `{path}` declares `{value}` for `ratified_by:`, but only `machine` is valid.", cta = "Use `ratified_by: machine` only when the loop signs the decision, or remove the field for a maintainer signature." }
CAIRN_DECISION_AFFECTS_INVALID = { heading = "Invalid affected path", body = "Decision `{path}` lists an invalid `affects:` entry `{value}`.", cta = "Use a normalised repository-relative path without backslashes, absolute paths, or `.` and `..` segments." }
CAIRN_REVIEW_SUBJECT_HASH_INVALID = { heading = "Invalid review subject hash", body = "Review `{path}` has an invalid `subject_hash:` value.", cta = "Use `sha256:` followed by 64 lowercase hexadecimal characters." }
CAIRN_REVIEW_REVIEWER_INVALID = { heading = "Invalid receipt reviewer", body = "Receipt-grade review `{path}` has a reviewer identifier that is not `<model-id>/<lens-id>`.", cta = "Use the provider model id, one slash, and the committed lens prompt file stem." }
CAIRN_REVIEW_LENS_PROMPT_HASH_INVALID = { heading = "Invalid lens prompt hash", body = "Receipt-grade review `{path}` lacks a valid `lens_prompt_hash:`.", cta = "Record `sha256:` followed by the 64 lowercase hexadecimal characters of the committed prompt file." }
CAIRN_DECISION_TIER_SPAN = { heading = "Local decision spans containers", body = "Local decision `{decision}` names nodes in more than one container.", cta = "Keep a local decision within one container, or declare it binding." }
CAIRN_DECISION_TIER_SUPERSEDES = { heading = "Local decision supersedes", body = "Local decision `{decision}` names superseded decisions.", cta = "Remove `supersedes:` or declare the decision binding." }
CAIRN_DECISION_TIER_BINDING_PATH = { heading = "Local decision affects a binding surface", body = "Local decision `{decision}` lists binding-surface path `{path}` in `affects:`.", cta = "Declare the decision binding for changes to this path." }
CAIRN_DECISION_CONVERGENCE_UNMET = { heading = "Decision receipts do not converge", body = "Accepted local decision `{decision}` has receipts that fail the required convergence leg: {leg}.", cta = "Provide two independent, clean, receipt-grade reviews bound to the current subject manifest." }
CAIRN_DECISION_RECEIPT_UNKNOWN = { heading = "Unknown decision receipt", body = "Decision `{decision}` names receipt `{receipt}`, but no loaded review has that file stem.", cta = "Add the review artefact or correct the `receipts:` entry." }
CAIRN_REVIEW_SUBJECT_UNMATCHED = { heading = "Stale review receipt", body = "Receipt-grade review `{path}` carries a `subject_hash` matching no local-tier decision's recomputed manifest.", cta = "Keep it as audit-only evidence of an earlier round, or refresh the review against the current subject." }
CAIRN_DECISION_MACHINE_BINDING = { heading = "Machine-signed binding decision", body = "Binding decision `{decision}` declares `ratified_by: machine`.", cta = "Use the machine marker only for a converged local decision, or remove it for a maintainer signature." }
CAIRN_HOOK_AFFECTS_SUBSET = { heading = "Changed path outside decision affects", body = "The commit accepts local decision `{decision}` but changes `{path}`, which is absent from `affects:`.", cta = "Add the path before review and refresh the receipt manifest, or remove the acceptance." }
CAIRN_HOOK_MANIFEST_MISMATCH = { heading = "Decision receipt manifest changed", body = "Local decision `{decision}` has receipts for a different subject manifest.", cta = "Restore the reviewed files or obtain fresh converged receipts for the current manifest." }


CT001 = { heading = "Interface contradiction", body = "Targets for `{node}` with the same contract role have divergent interfaces.", cta = "Review the contract and reconcile the interface shapes." }
CT002 = { heading = "Intentional asymmetry", body = "An intentional asymmetry was detected in `{node}` for contract role `{target}`.", cta = "Review the rationale to confirm the asymmetry is still correct." }
# -- Init ---------------------------------------------------------------

[init]
done = "initialized Cairn project"
next-steps = """
Next steps:
  1. Describe your system in cairn.blueprint (a starter was written)
  2. Run `cairn scan` to reconcile the blueprint against your code
  3. Wire cairn into your agent: `cairn init --wire` (appends a reference to
     CLAUDE.md or AGENTS.md automatically; skip if your agent ignores these)
  4. Point your agent at {pack}skills/cairn-dev to follow the dev loop

Existing codebase? `cairn init --from-code --apply --wire` maps and wires it in one step."""
next-steps-wired = """
Next steps:
  1. Describe your system in cairn.blueprint (a starter was written)
  2. Run `cairn scan` to reconcile the blueprint against your code
  3. Point your agent at {pack}skills/cairn-dev to follow the dev loop

Existing codebase? `cairn init --from-code --apply --wire` maps and wires it in one step."""

already = "Cairn is already initialized here (cairn.blueprint exists)."
nothing-backfilled = "All scaffolding is already in place; nothing to do."
backfilled = "Backfilled missing scaffolding:"
brownfield-already-applied = "brownfield init was already applied; reconciled the agent bootstrap"
err-completion-marker = "brownfield apply succeeded, but recording completion failed: {detail}"
next-steps-existing = """
Next steps:
  1. Run `cairn scan` to reconcile the blueprint against your code
  2. Run `cairn status` to review findings and backlog
  3. Wire cairn into your agent: `cairn init --wire`

Want to re-derive modules from code? `cairn init --from-code`."""
next-steps-existing-wired = """
Next steps:
  1. Run `cairn scan` to reconcile the blueprint against your code
  2. Run `cairn status` to review findings and backlog

Want to re-derive modules from code? `cairn init --from-code`."""

[init.from-code]
done = "brownfield init complete; change written to meta/changes/{change_id}/"
next-steps-header = "Next steps (review before you apply):"
ignore-proposal-header = "Suggested initial ignores (written only with `--apply`):"
ignore-applied-header = "Accepted initial ignores:"
err-ignore-scan = "could not inspect the project while proposing initial ignores: {detail}"
err-ignore-write = "could not write initial ignores: {detail}"
# One action per line, in order. The human ladder and the `--json`
# `next_actions` array are both rendered from this single list.
next-actions = """
Review `meta/changes/{change_id}/proposal.md` and correct the grouping, paths, edges, and contracts
Apply the reviewed change: `cairn change apply {change_id}`
Wire cairn into your agent: `cairn init --wire`
Reconcile the blueprint against your code: `cairn scan`
Group any files still unowned: `cairn onboard`
Check the commit gate: `cairn hook all`
"""

[init.wire]
done = "Wired .cairn/AGENTS.md into {file}."
already-wired = "Agent instructions already reference .cairn/AGENTS.md; nothing to do."
err-no-guide = "run `cairn init` first: .cairn/AGENTS.md not found"
err-truncated-block = "{file} has a cairn orientation block with no closing marker; restore or remove it, then rerun."
err-absolute = "usage: --wire <path> must be a relative path inside the project root"
err-symlink = "usage: --wire <path> must not be a symlink"
err-not-file = "usage: --wire <path> must be a regular file"
err-scaffold = "usage: --wire <path> must not target cairn's own scaffold files"
err-guide-not-file = ".cairn/AGENTS.md exists but is not a regular file"
err-read = "cannot read {file}: {detail}"
err-create-dir = "failed to create {dir}: {detail}"
err-write = "failed to write {file}: {detail}"
err-temp-collision = "too many temp file collisions"
err-from-code-conflict = "usage: cairn init --from-code --apply --wire [path]"

