# -- Brief (fused next-unit orientation) --------------------------------

[brief]
gates = """
Gates that will judge this unit (all must pass before merge):
  cairn hook all                                       # exit 0
  cairn scan                                           # zero findings

Cairn resolves and runs the project's gates via accept; the brief shows the exact recipe:"""
gates-skip = "  language battery ({language})                          # skipped (no gates configured for {language}; configure a `gates:` section in cairn.config.yaml to run build/test checks)"
staleness-note-todos = "Note: native todos live in meta/todos/ and are authoritative for the current checkout; reconcile against the repository's own task tracking before committing to this unit."
staleness-note-beads = "Note: the beads export can lag live Dolt. `bd ready` is authoritative; cross-check before committing to this unit."
unlinked-hint = "No graph node is linked to this bead, so no node-specific decisions or contract are surfaced. Bind one with `bd update {id} --label cairn-node:<node>` so future briefs load its constraints."
