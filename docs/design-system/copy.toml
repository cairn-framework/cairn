[help.commands.pack-resolve]
usage = "cairn pack resolve [--harness <name>] [--loop] [options]"
description = "Resolve an entry to its prompt bytes and required asset closure"

[help.commands.pack-campaign]
usage = "cairn pack campaign <start|verify|end> [--harness <name>] [--loop] [options]"
description = "Pin resolved pack bytes for a campaign, verify them, or release them"
args = """  start   Pin the resolved entry and its closure
  verify  Halt unless the live pack matches the pinned bytes
  end     Remove the campaign snapshot"""

