<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn — Architecture instrument</title>
<style>
  :root{
    /* warm graphite chassis, three close steps */
    --step-bezel:#2e2d29;
    --step-deck:#282723;
    --step-well:#211f1c;
    --chalk:#e8e4da;       /* ink, never pure white */
    --chalk-dim:#a49f92;
    --chalk-faint:#6f6b60;
    --signal:#5fb39a;      /* calibrated teal-green */
    --signal-deep:#3d8a72;
    --amber:#d99a2b;       /* drift only */
    --hairline:#3a382f;
    --grot:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--step-deck);color:var(--chalk);
    font-family:var(--grot);font-size:13.5px;line-height:1.45;
    display:flex;flex-direction:column;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ── Bezel ─────────────────────────────────────── */
  .bezel{
    display:flex;align-items:center;gap:28px;
    background:var(--step-bezel);
    border-bottom:1px solid var(--hairline);
    padding:10px 22px;flex-wrap:wrap;
  }
  .mark{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.02em;font-weight:500}
  .mark svg{display:block}
  .counters{display:flex;gap:18px;margin-left:20px;flex-wrap:wrap}
  .counter{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--hairline);padding-left:16px}
  .counter b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
  .counter span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--chalk-faint)}
  .counter.hash b{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding-top:3px;overflow-wrap:anywhere}
  .annunciator{
    margin-left:auto;
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
    border:1px solid var(--signal-deep);color:var(--signal);
    padding:5px 14px;border-radius:2px;
    background:color-mix(in srgb, var(--signal) 8%, transparent);
  }
  .annunciator.alarm{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb, var(--amber) 9%, transparent)}

  /* ── Command rail ──────────────────────────────── */
  .rail{
    display:flex;align-items:center;gap:18px;
    padding:7px 22px;border-bottom:1px solid var(--hairline);
    background:var(--step-bezel);flex-wrap:wrap;
  }
  .rail .search{
    display:flex;align-items:center;gap:8px;flex:0 1 320px;
    background:var(--step-well);border:1px solid var(--hairline);
    border-radius:3px;padding:4px 10px;
  }
  .rail input{border:0;background:none;outline:none;flex:1;font:inherit;color:var(--chalk)}
  .rail input::placeholder{color:var(--chalk-faint)}
  .rail .search:focus-within{border-color:var(--signal-deep)}
  .kbd{font-family:var(--mono);font-size:10px;color:var(--chalk-faint);
    border:1px solid var(--hairline);border-radius:3px;padding:0 5px}
  .toggles{display:flex;gap:2px;border:1px solid var(--hairline);border-radius:3px;overflow:hidden}
  .tog{font-size:11px;letter-spacing:.06em;padding:4px 12px;color:var(--chalk-dim);background:var(--step-deck)}
  .tog[aria-pressed="true"]{background:var(--step-well);color:var(--chalk);box-shadow:inset 0 -2px 0 var(--signal-deep)}
  .zoomers{margin-left:auto;display:flex;gap:2px}
  .zoomers button{width:26px;height:24px;border:1px solid var(--hairline);border-radius:3px;color:var(--chalk-dim);font-size:13px;line-height:1}
  .zoomers button:hover{color:var(--chalk);border-color:var(--chalk-faint)}
  .microlabel{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--chalk-faint)}

  /* ── Deck ──────────────────────────────────────── */
  .deck{flex:1;display:grid;grid-template-columns:1fr 366px;min-height:0}
  @media (max-width:900px){.deck{grid-template-columns:1fr}}
  .window{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--hairline)}
  .well{flex:1;overflow:auto;background:var(--step-well);position:relative;min-height:340px}
  svg{display:block}
  svg text{font-family:var(--grot)}

  /* calibration ticks drawn in JS */
  .tick{stroke:var(--chalk-faint);stroke-width:1;opacity:.4}

  .module{cursor:pointer}
  .module rect.body{fill:var(--step-deck);stroke:var(--hairline);stroke-width:1;rx:3}
  .module rect.keel{fill:var(--signal-deep)}
  .module text.nm{fill:var(--chalk);font-size:11.5px}
  .module text.meta{fill:var(--chalk-faint);font-size:9px;font-variant-numeric:tabular-nums}
  .module:hover rect.body{stroke:var(--chalk-faint)}
  .module.sel rect.body{stroke:var(--signal);stroke-width:1.5}
  .module.dim{opacity:.6}
  .module.hit rect.body{stroke:var(--signal);stroke-width:1.5}
  .bracket{stroke:var(--chalk-faint);stroke-width:1;fill:none;opacity:.6}
  .bracket-label{fill:var(--chalk-dim);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}
  .vector{stroke:var(--chalk-dim);stroke-width:.75;fill:none;opacity:.3}
  .vector.hl{stroke:var(--signal);stroke-width:1.3;opacity:1}
  .vector.dim{opacity:.06}
  .chev{fill:var(--chalk-dim);opacity:.5}
  .chev.hl{fill:var(--signal);opacity:1}

  .legend{
    position:absolute;right:16px;bottom:12px;
    background:var(--step-deck);border:1px solid var(--hairline);border-radius:3px;
    padding:7px 12px;display:flex;gap:16px;font-size:10.5px;color:var(--chalk-dim);flex-wrap:wrap;max-width:calc(100% - 32px)
  }
  .legend .it{display:flex;align-items:center;gap:7px}
  .legend .k{width:3px;height:14px;background:var(--signal-deep)}
  .legend .box{width:20px;height:12px;border:1px solid var(--hairline);border-left:3px solid var(--signal-deep);background:var(--step-deck)}
  .legend .ghost{border-style:dashed;border-left:3px double var(--chalk-faint);background:none}
  .legend .orphan{border-left-color:var(--amber);transform:rotate(-5deg)}

  /* ── Findings channel ──────────────────────────── */
  .channel{border-top:1px solid var(--hairline);background:var(--step-deck);padding:6px 22px 9px}
  .channel .microlabel{margin-right:16px}
  .channel .row{display:flex;gap:14px;align-items:baseline;padding:4px 0;border-top:1px solid var(--hairline);font-size:12px}
  .channel .row:first-of-type{border-top:0}
  .badge{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid var(--chalk-faint);color:var(--chalk-dim);border-radius:2px;padding:1px 7px;white-space:nowrap}
  .channel .code{font-family:var(--mono);font-size:10.5px;color:var(--chalk-dim);overflow-wrap:anywhere}
  .channel .path{font-family:var(--mono);font-size:10.5px;color:var(--chalk-dim);margin-left:auto;overflow-wrap:anywhere}
  @media (max-width:520px){.kbd{display:none}.channel .path{margin-left:0}}

  /* ── Inspector readout ─────────────────────────── */
  aside{background:var(--step-deck);overflow:auto}
  aside .head{padding:16px 20px 12px;border-bottom:1px solid var(--hairline)}
  aside .head .microlabel{display:block;margin-bottom:7px}
  aside h2{font-size:19px;font-weight:500;line-height:1.15}
  aside .id{font-family:var(--mono);font-size:11px;color:var(--chalk-faint);margin-top:3px}
  aside .desc{margin-top:8px;color:var(--chalk-dim);font-size:12.5px}
  .statelamp{display:inline-flex;align-items:center;gap:7px;margin-top:11px;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal)}
  .statelamp::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--signal-deep)}
  .grp{padding:12px 20px;border-bottom:1px solid var(--hairline)}
  .grp h3{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--chalk-faint);font-weight:500;margin-bottom:7px}
  .kv{width:100%;border-collapse:collapse;font-size:12px}
  .kv td{padding:4px 0;border-top:1px solid var(--hairline)}
  .kv tr:first-child td{border-top:0}
  .kv td:first-child{color:var(--chalk-dim);width:46%}
  .kv td:last-child{font-variant-numeric:tabular-nums;text-align:right}
  .kv td.mono{font-family:var(--mono);font-size:10.5px;text-align:right}
  .edge{padding:5px 0;border-top:1px solid var(--hairline);font-size:12px}
  .edge:first-of-type{border-top:0}
  .edge .dir{font-size:9px;letter-spacing:.14em;color:var(--signal);margin-right:7px}
  .edge .dir.in{color:var(--chalk-dim)}
  .edge .to{cursor:pointer;border-bottom:1px solid var(--hairline)}
  .edge .to:hover{border-bottom-color:var(--signal)}
  .edge .why{display:block;color:var(--chalk-dim);font-size:11px}
  .dec{padding:7px 0;border-top:1px solid var(--hairline)}
  .dec:first-of-type{border-top:0}
  .dec .t{font-size:12.5px;font-weight:500}
  .dec .m{font-family:var(--mono);font-size:10px;color:var(--chalk-faint);margin:2px 0}
  .dec .m .ok{color:var(--signal)}
  .dec .x{font-size:11.5px;color:var(--chalk-dim)}
  .empty{color:var(--chalk-faint);font-size:11.5px;font-style:italic}
</style>
</head>
<body>
<header class="bezel">
  <div class="mark">
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="3.4" rx="1" fill="#5fb39a"/><rect x="2.5" y="6" width="11" height="3.4" rx="1" fill="#a49f92"/><rect x="1" y="11" width="14" height="3.4" rx="1" fill="#6f6b60"/></svg>
    Cairn <span style="color:var(--chalk-faint);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-left:4px">Architecture</span>
  </div>
  <div class="counters">
    <div class="counter"><b id="c-nodes"></b><span>nodes</span></div>
    <div class="counter"><b id="c-edges"></b><span>edges</span></div>
    <div class="counter"><b id="c-findings"></b><span>findings</span></div>
    <div class="counter"><b id="c-errors"></b><span>errors</span></div>
    <div class="counter hash"><b id="c-hash"></b><span>interface hash</span></div>
  </div>
  <div class="annunciator" id="ann">Synced</div>
</header>

<div class="rail">
  <span class="microlabel">Graph</span>
  <label class="search">
    <svg width="11" height="11" viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6" fill="none" stroke="#a49f92"/><path d="M8 8l3 3" stroke="#a49f92"/></svg>
    <input id="q" type="search" placeholder="Find a node" aria-label="Find a node"><span class="kbd">/</span>
  </label>
  <div class="toggles" role="group" aria-label="Kind filter">
    <button class="tog" aria-pressed="true" data-kind="system">System</button>
    <button class="tog" aria-pressed="true" data-kind="container">Container</button>
    <button class="tog" aria-pressed="true" data-kind="module">Module</button>
  </div>
  <div class="zoomers" aria-label="Zoom">
    <button id="z-out" aria-label="Zoom out">−</button>
    <button id="z-in" aria-label="Zoom in">+</button>
    <button id="z-reset" aria-label="Reset zoom" style="width:auto;padding:0 8px;font-size:10px">RESET</button>
  </div>
</div>

<div class="deck">
  <section class="window" aria-label="Graph window">
    <div class="well">
      <svg id="canvas" role="img" aria-label="Architecture dependency graph"></svg>
      <div class="legend" aria-label="State legend">
        <span class="it"><span class="box"></span>Synced</span>
        <span class="it"><span class="box ghost"></span>Ghost (declared, not found)</span>
        <span class="it"><span class="box orphan"></span>Orphaned (found, not declared)</span>
      </div>
    </div>
    <div class="channel">
      <span class="microlabel">Findings</span><span id="ch-sum" style="font-size:11.5px;color:var(--chalk-dim)"></span>
      <div id="ch-rows"></div>
    </div>
  </section>

  <aside aria-label="Node readout">
    <div class="head">
      <span class="microlabel">Node readout</span>
      <h2 id="i-name"></h2>
      <div class="id" id="i-id"></div>
      <p class="desc" id="i-desc"></p>
      <span class="statelamp" id="i-state"></span>
    </div>
    <div class="grp"><h3>Registers</h3><table class="kv" id="i-facts"></table></div>
    <div class="grp"><h3>Dependencies</h3><div id="i-edges"></div></div>
    <div class="grp"><h3>Decision lineage</h3><div id="i-decs"></div></div>
  </aside>
</div>

<script src="data.js"></script>
<script>
const D = window.CAIRN_DATA;
const byId = Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const svg = document.getElementById('canvas');
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}

/* ── layered layout: system row, container brackets, module grid ── */
const W = Math.max(880, document.querySelector('.well').clientWidth - 8);
const modW=n=>Math.max(118,n.name.length*6.8+40), modH=36, gx=12, gy=16, pad=64;
const system = D.nodes.find(n=>n.kind==='system');
const containers = D.nodes.filter(n=>n.kind==='container');
const pos={}; let y=30;

/* system master module */
pos[system.id]={x:pad,y,w:340,h:modH}; y+=modH+30;

/* container sections then loose modules */
const sections=[];
for(const c of containers) sections.push({head:c, members:D.nodes.filter(n=>n.parent===c.id)});
sections.push({head:null, label:'root modules', members:D.nodes.filter(n=>n.kind==='module'&&(n.parent===system.id||!n.parent))});

for(const sec of sections){
  sec.y0=y; y+=18;
  let x=pad, rowY=y;
  const items = sec.head?[sec.head,...sec.members]:sec.members;
  for(const n of items){
    const w = n.kind==='container'?200:modW(n);
    if(x+w>W-30){x=pad;rowY+=modH+gy;}
    pos[n.id]={x,y:rowY,w,h:modH}; x+=w+gx;
  }
  y=rowY+modH+14; sec.y1=y; y+=16;
}
svg.setAttribute('width',W);svg.setAttribute('height',y);
svg.setAttribute('viewBox',`0 0 ${W} ${y}`);
let zoom=1;
function applyZoom(){svg.setAttribute('width',W*zoom);svg.setAttribute('height',y*zoom);}
document.getElementById('z-in').onclick=()=>{zoom=Math.min(2,zoom+0.15);applyZoom();};
document.getElementById('z-out').onclick=()=>{zoom=Math.max(0.5,zoom-0.15);applyZoom();};
document.getElementById('z-reset').onclick=()=>{zoom=1;applyZoom();};

/* margin calibration ticks */
for(let ty=20;ty<y;ty+=40){el('line',{x1:6,x2:14,y1:ty,y2:ty,class:'tick'});
  el('line',{x1:W-14,x2:W-6,y1:ty,y2:ty,class:'tick'});}

/* section brackets */
for(const sec of sections){
  const label = sec.head?sec.head.name:sec.label;
  el('path',{d:`M ${pad-18} ${sec.y0+14} L ${pad-26} ${sec.y0+14} L ${pad-26} ${sec.y1-6} L ${pad-18} ${sec.y1-6}`,class:'bracket'});
  const t=el('text',{x:pad-32,y:sec.y0+14,class:'bracket-label','text-anchor':'end',transform:`rotate(-90 ${pad-32} ${sec.y1-8})`});
  const t2=el('text',{x:pad,y:sec.y0+6,class:'bracket-label'}); t2.textContent=label;
  t.remove();
}

/* edges */
const edgeLayer=el('g',{});
function path(a,b){
  const ax=a.x+a.w/2, bx=b.x+b.w/2;
  if(Math.abs(a.y-b.y)<1) return `M ${ax} ${a.y} C ${ax} ${a.y-24}, ${bx} ${b.y-24}, ${bx} ${b.y}`;
  const [sx,sy,ex,ey]= a.y<b.y ? [ax,a.y+a.h,bx,b.y] : [ax,a.y,bx,b.y+b.h];
  const mid=(sy+ey)/2;
  return `M ${sx} ${sy} C ${sx} ${mid}, ${ex} ${mid}, ${ex} ${ey}`;
}
const edgeEls=D.edges.map(e=>{
  const a=pos[e.from],b=pos[e.to]; if(!a||!b)return null;
  const p=el('path',{d:path(a,b),class:'vector'},edgeLayer);
  p.dataset.from=e.from;p.dataset.to=e.to;
  const mx=(a.x+a.w/2+b.x+b.w/2)/2, my=(a.y<b.y? (a.y+a.h+b.y)/2 : (a.y+b.y+b.h)/2);
  const dir = a.y<=b.y?1:-1;
  const c=el('polygon',{points:`${mx-3},${my-3*dir} ${mx+3},${my-3*dir} ${mx},${my+3*dir}`,class:'chev'},edgeLayer);
  c.dataset.from=e.from;c.dataset.to=e.to;
  return [p,c];
}).filter(Boolean);

/* modules */
const nodeEls={};
for(const n of D.nodes){
  const p=pos[n.id];
  const g=el('g',{class:'module','data-id':n.id,tabindex:0,role:'button','aria-label':n.name});
  el('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:3,class:'body'},g);
  el('rect',{x:p.x,y:p.y,width:3,height:p.h,class:'keel'},g);
  const t=el('text',{x:p.x+13,y:p.y+16,class:'nm'},g); t.textContent=n.name;
  if(n.kind!=='module'){t.setAttribute('style','font-size:13px;letter-spacing:.02em;font-weight:500')}
  const m=el('text',{x:p.x+13,y:p.y+29,class:'meta'},g);
  m.textContent = n.kind==='system'?'SYSTEM · '+D.status.nodes+' nodes'
    : n.kind==='container'?'CONTAINER · '+n.children.length+' members'
    : n.files+' files · '+n.symbols+' sym';
  nodeEls[n.id]=g;
  g.addEventListener('click',()=>select(n.id));
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id);}});
}

/* selection */
let selected=null;
function neighbours(id){const s=new Set([id]);
  D.edges.forEach(e=>{if(e.from===id)s.add(e.to);if(e.to===id)s.add(e.from);});return s;}
function select(id){
  selected=id; const nb=neighbours(id);
  for(const nid in nodeEls){
    nodeEls[nid].classList.toggle('sel',nid===id);
    nodeEls[nid].classList.toggle('dim',!nb.has(nid));
  }
  edgeEls.forEach(([p,c])=>{
    const on=p.dataset.from===id||p.dataset.to===id;
    p.classList.toggle('hl',on);p.classList.toggle('dim',!on);
    c.classList.toggle('hl',on);
  });
  renderInspector(id);
}
function renderInspector(id){
  const n=byId[id];
  document.getElementById('i-name').textContent=n.name;
  document.getElementById('i-id').textContent=n.id;
  document.getElementById('i-desc').textContent=n.description||'';
  document.getElementById('i-state').textContent=n.state;
  document.getElementById('i-facts').innerHTML=[
    ['Kind',n.kind],['Path',n.paths[0]||'(none)','mono'],
    ['Files',n.files],['Symbols',n.symbols],['Contracts',n.contracts]
  ].map(([k,v,c])=>`<tr><td>${k}</td><td class="${c||''}">${v}</td></tr>`).join('');
  const outs=D.edges.filter(e=>e.from===id),ins=D.edges.filter(e=>e.to===id);
  const row=(e,dir)=>{const o=dir==='out'?e.to:e.from;
    return `<div class="edge"><span class="dir ${dir==='in'?'in':''}">${dir==='out'?'OUT':'IN'}</span>`+
      `<span class="to" data-nav="${o}">${byId[o].name}</span>`+
      `<span class="why">${e.description}</span></div>`;};
  document.getElementById('i-edges').innerHTML=
    (outs.map(e=>row(e,'out')).join('')+ins.map(e=>row(e,'in')).join(''))||
    '<div class="empty">No dependency edges recorded.</div>';
  const decs=D.decisions[id]||[];
  document.getElementById('i-decs').innerHTML=decs.length?decs.map(d=>
    `<div class="dec"><div class="t">${d.title}</div>`+
    `<div class="m">${d.id} · ${d.date} · <span class="ok">${d.status}</span></div>`+
    `<div class="x">${d.excerpt}…</div></div>`).join('')
    :'<div class="empty">No decisions recorded for this node.</div>';
  document.querySelectorAll('#i-edges .to').forEach(x=>
    x.addEventListener('click',()=>select(x.dataset.nav)));
}

/* bezel counters */
document.getElementById('c-nodes').textContent=D.status.nodes;
document.getElementById('c-edges').textContent=D.status.edges;
document.getElementById('c-findings').textContent=D.findings.length;
document.getElementById('c-errors').textContent=D.status.errors;
document.getElementById('c-hash').textContent=D.status.interface_hash;
if(D.findings.some(f=>f.severity==='error'||f.severity==='warning')){
  const a=document.getElementById('ann');a.classList.add('alarm');a.textContent='Drift';}

/* findings channel */
document.getElementById('ch-sum').textContent=
  D.findings.length?'':(D.copy['no-findings'].heading+' · '+D.copy['no-findings'].body);
document.getElementById('ch-rows').innerHTML=D.findings.map(f=>
  `<div class="row"><span class="badge">${f.severity}</span><span class="code">${f.code}</span>`+
  `<span>${f.message}</span><span class="path">${f.path}</span></div>`).join('');

/* search + toggles */
const q=document.getElementById('q');
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}});
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  for(const id in nodeEls){
    const hit=v&&(id.toLowerCase().includes(v)||byId[id].name.toLowerCase().includes(v));
    nodeEls[id].classList.toggle('hit',!!hit);
    if(v)nodeEls[id].classList.toggle('dim',!hit);
    else if(!selected)nodeEls[id].classList.remove('dim');
  }
  if(!v&&selected)select(selected);
});
document.querySelectorAll('.tog').forEach(b=>b.addEventListener('click',()=>{
  const on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',on);
  for(const n of D.nodes){if(n.kind===b.dataset.kind)nodeEls[n.id].style.display=on?'':'none';}
}));

select('cairn.kernel.scanner');
</script>
</body>
