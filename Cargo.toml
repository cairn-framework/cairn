[workspace]
members = [".", "cairn-macros"]
resolver = "3"

[workspace.dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny" }
pedantic = { level = "deny" }
cargo = { level = "deny" }
dbg_macro = { level = "deny" }
todo = { level = "deny" }
use_self = { level = "deny" }

[package]
name = "cairn-framework"
version = "0.1.4"
edition = "2024"
description = "Foundation package for the Cairn architecture graph tool."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/cairn-framework/cairn"
homepage = "https://github.com/cairn-framework/cairn"
keywords = ["architecture", "graph", "blueprint", "cli", "rust"]
categories = ["command-line-utilities", "development-tools"]

# Default package would ship the whole repo (demo GIFs/MP4s, PDFs,
# .beads bookkeeping, archived research screenshots, test fixtures):
# 42MB+ packaged, over crates.io's 10MB upload cap. Allowlist just
# what `src/**` needs to compile plus its `include_str!`-embedded
# runtime assets (webui, agent guide, `cairn init`'s bundled skills).
include = [
    "src/**/*.rs",
    "src/cli/agent_guide.md",
    "src/ui_assets/index.html",
    "src/ui_assets/app.js",
    "src/ui_assets/style.css",
    "src/ui_assets/vendor/*.js",
    "docs/design-system/copy.toml",
    "docs/design-system/tokens.css",
    "docs/design-system/components.css",
    ".claude/skills/cairn-dev/SKILL.md",
    ".claude/skills/cairn-dev/references/*.md",
    ".claude/skills/cairn-explore/SKILL.md",
    ".claude/skills/cairn-propose/SKILL.md",
    ".claude/skills/cairn-apply/SKILL.md",
    ".claude/skills/cairn-archive/SKILL.md",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "CHANGELOG.md",
]

[package.metadata.dist]
# The default Homebrew formula name derives from the crates.io package
# name (cairn-framework); override to match the primary CLI binary so
# `brew install cairn-framework/tap/cairn` is the resulting command.
formula = "cairn"

[lib]
name = "cairn"
path = "src/lib.rs"

[[bin]]
name = "cairn"
path = "src/main.rs"

[[bin]]
name = "cairn-mcp"
path = "src/bin/cairn-mcp.rs"

[[bin]]
name = "cairn-lsp"
path = "src/bin/cairn-lsp.rs"

[lints]
workspace = true

[dependencies]
cairn-macros = { path = "cairn-macros", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
serde_yaml = "0.9.34"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
camino = "1.2.3"
crossbeam-channel = "0.5.15"

[target.'cfg(unix)'.dependencies]
# POSIX-only: SIGINT handling in src/signal.rs. Windows gets a no-op stub
# (Ctrl-C still terminates the process; it just skips the flag-based
# graceful-shutdown path). `extended-siginfo-raw` pulls in a `cc`
# build-dependency that compiles against POSIX siginfo_t, unavailable on
# Windows.
signal-hook = { version = "0.3", default-features = false, features = ["extended-siginfo-raw"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[dev-dependencies]
insta = { version = "1", features = ["json", "yaml", "redactions"] }
tempfile = "3"
