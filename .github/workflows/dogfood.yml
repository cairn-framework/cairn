name: Dogfood

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratification gate resolves merge-base(origin/main, HEAD); a
          # shallow checkout has no base ref, and the gate fails closed.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build cairn
        run: cargo build --release

      - name: Install cairn
        run: cargo install --path . --force

      - name: Run dogfood gate
        run: ./scripts/dogfood.sh
