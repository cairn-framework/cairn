name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      # Quality gates run locally via prek pre-push hook.
      # Re-add as a CI step once needed.

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --all-targets --all-features
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  hooks:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install prek
        run: |
          curl -LsSf https://github.com/j178/prek/releases/latest/download/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: validate hook config
        run: prek validate-config .pre-commit-config.yaml

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install biome
        run: npm install -g @biomejs/biome@2.4.4
      - name: biome check
        run: biome check --error-on-warnings src/ui_assets/app.js src/ui_assets/style.css
      - name: design-token conformance
        run: sh scripts/check-design-tokens.sh
      - name: accessibility static audit
        run: sh scripts/check-a11y.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: visual harness
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: |
          mkdir -p harness/out
          rc=0
          node harness/eval.mjs > harness/out/ci.log 2>&1 || rc=$?
          score=$(grep -oE 'ux_defect_score=[0-9]+' harness/out/ci.log | cut -d= -f2)
          if [ "$rc" -ne 0 ] || [ "$score" != "0" ]; then
            echo "harness exit=$rc ux_defect_score=$score (must be 0)"
            cat harness/out/ci.log
            exit 1
          fi
